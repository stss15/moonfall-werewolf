<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#080811">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moonfall">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Moonfall — a serverless, peer-to-peer Werewolf card game for phones around one table.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <title>Moonfall — Werewolf</title>
  <style>:root{
  color-scheme:dark;
  --ink:#f8f0de;
  --muted:#b9afc2;
  --faint:#797183;
  --night:#070812;
  --night-2:#0d1020;
  --plum:#1e1429;
  --plum-2:#2c1939;
  --purple:#7c4aa4;
  --violet:#c29aef;
  --gold:#dfb755;
  --gold-2:#fff0a9;
  --gold-deep:#74501e;
  --blood:#a73546;
  --green:#6ecf9b;
  --line:rgba(224,185,89,.28);
  --glass:rgba(10,9,18,.82);
  --shadow:0 24px 70px rgba(0,0,0,.52);
  --safe-top:max(16px,env(safe-area-inset-top));
  --safe-bottom:max(18px,env(safe-area-inset-bottom));
  --radius:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--night);min-height:100%;width:100%;max-width:100%;overscroll-behavior:none}
body{
  margin:0;min-height:100svh;width:100%;max-width:100%;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  /* Transparent: html carries the base colour so the fixed scenery layers
     (table art, fireflies, phase sky) painted at negative z-index show. */
  background:transparent;overflow-x:hidden;touch-action:manipulation;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none
}
/* Once a player enters the village, the document becomes a sealed game
   viewport. Controls may adapt inside their fixed rails, but the browser
   page itself never pans or scrolls beyond the phone screen. */
body:not([data-phase="home"]){position:fixed;inset:0;height:100svh;height:100dvh;min-height:0;overflow:hidden}
body:not([data-phase="home"]) #app{width:100%;height:100%;overflow:hidden auto}
input,textarea{user-select:text;-webkit-user-select:text}
img{-webkit-touch-callout:none;pointer-events:none}
#world{position:fixed;inset:0;z-index:-5;overflow:hidden;pointer-events:none;background:#050711}
.world-plate{position:absolute;inset:-2%;background-position:center;background-size:cover;background-repeat:no-repeat;transform:scale(1.025);transition:opacity 4.8s cubic-bezier(.35,.05,.2,1),filter 4.8s ease,transform 8s ease;will-change:opacity,filter}
.world-night{background-image:url("assets/sprites/bg/square-night.webp");opacity:1;filter:saturate(.88) brightness(.78)}
.world-day{background-image:url("assets/sprites/bg/square-day.webp");opacity:0;filter:saturate(.84) brightness(.92)}
.world-grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,5,13,.12),transparent 38%,rgba(3,3,8,.64));transition:background 4.8s ease}
.sky-orbit{position:absolute;left:23%;top:8%;width:min(13vw,118px);aspect-ratio:1;border-radius:50%;transition:opacity 4.6s ease,transform 5.4s cubic-bezier(.25,.1,.2,1);mix-blend-mode:screen}
.moon-orbit{opacity:.54;background:radial-gradient(circle,rgba(244,248,255,.62),rgba(145,190,255,.18) 42%,transparent 72%);box-shadow:0 0 70px rgba(160,205,255,.25)}
.sun-orbit{opacity:0;transform:translate(-18vw,22vh) scale(.65);background:radial-gradient(circle,rgba(255,251,218,.68),rgba(255,189,89,.22) 40%,transparent 72%);box-shadow:0 0 90px rgba(255,198,100,.32)}
body[data-phase="dawn"] .world-day,body[data-phase="sheriff-vote"] .world-day,body[data-phase^="day-"] .world-day,body[data-phase="session-over"] .world-day{opacity:1}
body[data-phase="dawn"] .world-night,body[data-phase="sheriff-vote"] .world-night,body[data-phase^="day-"] .world-night,body[data-phase="session-over"] .world-night{filter:saturate(.84) brightness(.94)}
body[data-phase="dawn"] .moon-orbit,body[data-phase="sheriff-vote"] .moon-orbit,body[data-phase^="day-"] .moon-orbit,body[data-phase="session-over"] .moon-orbit{opacity:0;transform:translate(12vw,-18vh) scale(.72)}
body[data-phase="dawn"] .sun-orbit,body[data-phase="sheriff-vote"] .sun-orbit,body[data-phase^="day-"] .sun-orbit,body[data-phase="session-over"] .sun-orbit{opacity:.6;transform:translate(0,0) scale(1)}
body[data-phase="dawn"] .world-grade,body[data-phase="sheriff-vote"] .world-grade,body[data-phase^="day-"] .world-grade,body[data-phase="session-over"] .world-grade{background:linear-gradient(180deg,rgba(255,224,170,.08),transparent 42%,rgba(32,22,12,.38))}
body[data-phase="game-over"][data-outcome="village"] .world-day,body[data-phase="game-over"][data-outcome="lovers"] .world-day{opacity:1}
body[data-phase="game-over"][data-outcome="village"] .sun-orbit,body[data-phase="game-over"][data-outcome="lovers"] .sun-orbit{opacity:.62;transform:none}
body[data-phase="game-over"][data-outcome="wolves"] .world-night{filter:saturate(1.04) brightness(.68)}
body:before{content:none}
body:after{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(circle at 50% 12%,rgba(100,127,196,.22),transparent 34%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.58));
}
body[data-phase="dawn"]:after{background:radial-gradient(circle at 50% 12%,rgba(255,182,110,.32),transparent 44%),linear-gradient(180deg,transparent 52%,rgba(20,8,14,.5))}
body[data-phase="sheriff-vote"]:after,body[data-phase="day-discussion"]:after,body[data-phase="day-vote"]:after,body[data-phase="day-result"]:after{background:radial-gradient(circle at 50% 10%,rgba(255,240,190,.34),transparent 40%),linear-gradient(180deg,transparent 56%,rgba(26,20,10,.44))}
button,input,select{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
button:disabled{opacity:.42;filter:saturate(.45);cursor:not-allowed}
img{display:block;max-width:100%}
h1,h2,h3,p{margin-top:0}
h1,h2,h3,.display{font-family:Georgia,"Times New Roman",serif}
.hidden{display:none!important}
.screen{width:min(100%,560px);min-height:100svh;margin:0 auto;padding:var(--safe-top) 14px calc(var(--safe-bottom) + 22px);position:relative}
.screen.centered{display:flex;flex-direction:column;justify-content:center}
.screen.has-dock{padding-bottom:calc(var(--safe-bottom) + 116px)}
.awake-screen:before{content:"";position:fixed;z-index:-1;inset:-12%;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(194,154,239,.26),transparent 43%);animation:awake-glow 2.2s ease-in-out infinite}
.awake-screen:after{content:"";position:fixed;z-index:19;inset:7px;border:1px solid rgba(255,224,139,.44);border-radius:28px;pointer-events:none;box-shadow:inset 0 0 24px rgba(223,183,85,.13),0 0 26px rgba(124,74,164,.2);animation:awake-frame 2.2s ease-in-out infinite}
.awake-wolves:before{background:radial-gradient(circle at 50% 42%,rgba(167,53,70,.31),transparent 46%)}
.awake-cupid:before,.awake-lovers:before{background:radial-gradient(circle at 50% 42%,rgba(214,65,130,.25),transparent 45%)}
.awake-seer:before{background:radial-gradient(circle at 50% 42%,rgba(101,55,174,.4),transparent 46%)}
.awake-witch:before{background:radial-gradient(circle at 50% 42%,rgba(21,112,64,.42),transparent 46%)}
.awake-hunter:before{background:radial-gradient(circle at 50% 42%,rgba(0,0,0,.72),rgba(54,61,68,.24) 38%,transparent 68%)}
.awake-hunter:after{border-color:rgba(170,180,185,.35);box-shadow:inset 0 0 38px rgba(0,0,0,.78),0 0 28px rgba(135,145,150,.18)}
.awake-sheriff:before,.awake-thief:before{background:radial-gradient(circle at 50% 42%,rgba(210,164,58,.27),transparent 46%)}
@keyframes awake-glow{50%{opacity:.55;transform:scale(.94)}}
@keyframes awake-frame{50%{opacity:.52;box-shadow:inset 0 0 38px rgba(223,183,85,.18),0 0 42px rgba(124,74,164,.28)}}
.boot{min-height:100svh;display:grid;place-content:center;text-align:center;padding:30px;color:var(--muted)}
.boot img{width:min(88vw,430px);margin:auto;filter:drop-shadow(0 12px 32px #000)}
.boot p{margin-top:18px;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.moon-loader{width:34px;height:34px;border:1px solid rgba(223,183,85,.3);border-radius:50%;margin:24px auto 0;padding:4px}
.moon-loader span{display:block;width:100%;height:100%;border-radius:50%;background:var(--gold);box-shadow:0 0 20px rgba(223,183,85,.6);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.72)}}
#atmosphere{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
#atmosphere i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff4c3;box-shadow:0 0 8px #d9c0ff;opacity:.3;animation:drift 12s linear infinite}
#atmosphere i:nth-child(1){left:8%;top:22%;animation-delay:-2s}.atmosphere i:nth-child(2){left:19%;top:58%}
#atmosphere i:nth-child(2){left:19%;top:58%;animation-delay:-7s}#atmosphere i:nth-child(3){left:36%;top:13%;animation-delay:-4s}
#atmosphere i:nth-child(4){left:48%;top:41%;animation-delay:-10s}#atmosphere i:nth-child(5){left:65%;top:18%;animation-delay:-5s}
#atmosphere i:nth-child(6){left:78%;top:64%;animation-delay:-1s}#atmosphere i:nth-child(7){left:89%;top:28%;animation-delay:-8s}
#atmosphere i:nth-child(8){left:57%;top:79%;animation-delay:-3s}
@keyframes drift{0%{transform:translateY(18px);opacity:0}20%{opacity:.5}80%{opacity:.2}100%{transform:translateY(-72px);opacity:0}}
.home{padding-top:calc(var(--safe-top) + 8px)}
.home-clean{display:flex;flex-direction:column;justify-content:center;padding-top:calc(var(--safe-top) + 62px);padding-bottom:calc(var(--safe-bottom) + 14px)}
.home-tools{position:absolute;z-index:5;top:var(--safe-top);right:14px;display:flex;gap:9px}
.home-tool{width:52px;height:52px;border:1px solid rgba(223,183,85,.25);border-radius:16px;background:rgba(7,7,14,.72);backdrop-filter:blur(12px);display:grid;place-content:center;color:var(--gold-2);box-shadow:0 8px 24px rgba(0,0,0,.32)}
.home-tool span{font-size:20px;line-height:18px}.home-tool small{font-size:8px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}
.home-clean .brand-lockup{margin:0 auto 8px}.home-clean .brand-lockup img{width:min(88%,420px)}.home-clean .brand-lockup p{font-size:13px}
.home-quick{display:flex;justify-content:center;gap:9px;margin:12px 0 0}.home-quick button{min-height:45px;display:flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid rgba(223,183,85,.24);border-radius:14px;background:rgba(9,8,15,.72);color:var(--muted)}.home-quick button span{color:var(--gold);font-size:18px}.home-quick button strong{font-size:11px;color:var(--ink)}
.brand-lockup{text-align:center;margin:6px auto 14px}
.brand-lockup img{width:min(100%,480px);margin:auto;filter:drop-shadow(0 12px 34px rgba(0,0,0,.85))}
.brand-lockup p{color:#d4c7dd;font-family:Georgia,serif;font-size:15px;letter-spacing:.08em;margin:-4px 0 0}
.eyebrow{color:var(--gold);font-size:10px;font-weight:900;letter-spacing:.19em;text-transform:uppercase;margin:0 0 8px}
.panel{
  position:relative;border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:12px 0;background:
    linear-gradient(145deg,rgba(43,25,53,.94),rgba(10,10,19,.95) 62%),var(--glass);
  box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.04);overflow:hidden
}
.panel:before{content:"";position:absolute;inset:5px;border:1px solid rgba(230,190,92,.08);border-radius:calc(var(--radius) - 6px);pointer-events:none}
.panel.compact{padding:15px 16px;border-radius:18px}
.panel.ornate{border-color:rgba(223,183,85,.46);box-shadow:0 24px 70px rgba(0,0,0,.58),0 0 38px rgba(117,66,153,.12),inset 0 0 30px rgba(117,66,153,.08)}
.panel h2{font-size:clamp(25px,7vw,34px);line-height:1.05;margin-bottom:8px}.panel h3{margin-bottom:7px}
.muted{color:var(--muted);line-height:1.5}.small{font-size:12px}.tiny{font-size:10px}.center{text-align:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;background:rgba(5,5,10,.62);border:1px solid rgba(223,183,85,.19);border-radius:16px;margin-bottom:18px}
.tab{border:0;background:transparent;border-radius:12px;padding:11px 8px;font-size:13px;font-weight:800;color:var(--muted)}
.tab.active{color:#201506;background:linear-gradient(#ffe39a,#c99337);box-shadow:0 5px 18px rgba(0,0,0,.36)}
.field{margin:14px 0}.field label{display:block;color:#d2c4d8;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0 0 7px}
.input,select.input{
  width:100%;height:53px;border:1px solid rgba(223,183,85,.23);border-radius:14px;background:rgba(3,4,9,.76);padding:0 15px;color:var(--ink);box-shadow:inset 0 2px 10px rgba(0,0,0,.38)
}
.input::placeholder{color:#726a78}.code-input{text-transform:uppercase;text-align:center;letter-spacing:.23em;font-weight:900;font-size:23px}
.btn{
  min-height:52px;border-radius:14px;border:1px solid #e9c869;padding:13px 18px;background:
    linear-gradient(180deg,#ffe69d 0%,#d2a341 50%,#a87424 100%);color:#241606;font-weight:900;letter-spacing:.02em;
  box-shadow:inset 0 1px #fff8cb,inset 0 -2px rgba(59,30,3,.38),0 9px 22px rgba(0,0,0,.34);cursor:pointer;position:relative
}
.btn{transition:transform .12s ease,box-shadow .12s ease,filter .2s ease}
.btn:active{transform:translateY(1px) scale(.985);box-shadow:inset 0 1px #fff3ba,inset 0 -1px rgba(59,30,3,.35),0 5px 12px rgba(0,0,0,.4)}
.choice,.potion,.pack-option,.role-toggle,.tab{transition:transform .12s ease,border-color .18s ease,box-shadow .18s ease}
.choice:active,.potion:active,.pack-option:active,.role-toggle:active{transform:scale(.97)}
.btn.wide{width:100%}.btn.secondary{border-color:rgba(216,192,226,.34);background:linear-gradient(180deg,#3e2c4c,#21172b);color:var(--ink);box-shadow:inset 0 1px rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.3)}
.btn.ghost{background:rgba(8,8,15,.35);border-color:rgba(223,183,85,.22);color:var(--muted);box-shadow:none}.btn.danger{background:linear-gradient(#c34e5d,#792434);border-color:#dd6976;color:white}.btn.mini{min-height:38px;padding:8px 12px;border-radius:11px;font-size:12px}
.button-stack{display:grid;gap:9px}.button-row{display:flex;gap:9px}.button-row>*{flex:1}.button-row .fit{flex:0 0 auto}
.home-note{display:flex;gap:10px;align-items:flex-start;margin:14px 4px 0;color:#a99dac;font-size:11px;line-height:1.45}.home-note strong{color:var(--gold)}
.app-install-card{width:100%;display:grid;grid-template-columns:38px 1fr 18px;gap:11px;align-items:center;margin:13px 0 4px;padding:12px 13px;border:1px solid rgba(223,183,85,.3);border-radius:15px;background:linear-gradient(145deg,rgba(57,36,69,.76),rgba(10,9,17,.78));text-align:left;color:var(--ink);box-shadow:0 10px 28px rgba(0,0,0,.3)}
.app-install-card>span:first-child{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#8a58ad,#34203f);border:1px solid rgba(255,226,143,.34);color:var(--gold-2);font-size:20px}.app-install-card strong{display:block;font-family:Georgia,serif;font-size:15px}.app-install-card small{display:block;color:var(--muted);font-size:9px;line-height:1.4;margin-top:2px}.app-install-card b{color:var(--gold);font-size:22px}
.resume-banner{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid rgba(110,207,155,.3);background:rgba(20,55,43,.35);border-radius:15px;margin:10px 0}.resume-banner div{flex:1}.resume-banner strong{display:block;color:#b8f5d4}
/* Floating header tab: the bar is folded away behind a small glass pill so
   the screen belongs to the game. The dot stays glanceable for connection. */
.top-dock{position:fixed;top:var(--safe-top);right:12px;z-index:30}
.top-tab{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid rgba(223,183,85,.32);background:rgba(6,6,13,.7);backdrop-filter:blur(12px);color:var(--gold-2);box-shadow:0 8px 24px rgba(0,0,0,.38);transition:transform .15s ease}
.top-tab:active{transform:scale(.95)}
.top-tab b{font-weight:400;font-size:17px;line-height:1}
.connection-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 9px rgba(110,207,155,.8)}
.connection-dot.offline{background:#d45867;box-shadow:0 0 8px rgba(212,88,103,.6)}
.top-sheet{position:absolute;top:calc(100% + 6px);right:0;width:max-content;max-width:min(calc(100vw - 24px),300px);display:flex;align-items:center;gap:8px;padding:6px 7px 6px 12px;border-radius:14px;border:1px solid rgba(223,183,85,.34);background:rgba(6,5,12,.92);backdrop-filter:blur(14px);box-shadow:0 14px 34px rgba(0,0,0,.5);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .22s ease,transform .22s ease}
.top-dock.open .top-tab{border-color:rgba(255,224,139,.6)}
.top-dock.open .top-sheet{opacity:1;transform:none;pointer-events:auto}
.mini-mark{width:48px;height:48px;object-fit:cover;object-position:center;border-radius:50%;border:1px solid rgba(223,183,85,.43);box-shadow:0 4px 18px #000}
.top-copy{min-width:0;flex:1}.top-copy strong{display:block;font-family:Georgia,serif;font-size:14px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-copy span{color:var(--muted);font-size:9px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.top-sheet .icon-btn{width:34px;height:34px;font-size:17px;flex:0 0 auto}
.connection{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);padding:7px 9px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(4,5,10,.54)}
.connection i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(110,207,155,.7)}.connection.offline i{background:#d45867;box-shadow:none}
.phase-ribbon{text-align:center;margin:6px auto 14px;padding-right:0}.phase-ribbon .moon-number{display:inline-flex;align-items:center;gap:6px;color:var(--violet);font-size:10px;font-weight:900;letter-spacing:.17em;text-transform:uppercase}.phase-ribbon h1{font-size:clamp(31px,9vw,45px);line-height:.98;margin:7px 0 6px;text-shadow:0 4px 18px #000}.phase-ribbon p{font-family:Georgia,serif;color:#d5c8d5;font-size:14px;line-height:1.4;margin:0 auto;max-width:390px}
.room-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--gold-2);font-size:clamp(38px,13vw,64px);font-weight:950;letter-spacing:.16em;margin:6px 0 2px;text-shadow:0 0 22px rgba(223,183,85,.24)}
.player-list{display:grid;gap:8px;margin:13px 0}.player-row{display:flex;align-items:center;gap:11px;padding:10px 11px;border:1px solid rgba(255,255,255,.08);background:rgba(3,4,9,.42);border-radius:14px;min-height:53px}
.player-row.dead{opacity:.55}.avatar{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;background:linear-gradient(145deg,#5e3d70,#26182f);border:1px solid rgba(223,183,85,.23);font-family:Georgia,serif;color:var(--gold-2);font-weight:900}.player-row .info{flex:1;min-width:0}.player-row .info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-row .info span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.status-icons{display:flex;gap:5px;align-items:center}.status-icon{font-size:12px;padding:4px 6px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:#15101d}.kick{border:0;background:transparent;color:#8f818f;font-size:18px;padding:8px}
.pack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.pack-option{min-height:75px;border:1px solid rgba(223,183,85,.18);border-radius:13px;background:rgba(3,4,9,.45);padding:9px 7px;color:var(--muted);text-align:center}.pack-option strong{display:block;color:var(--ink);font-family:Georgia,serif;font-size:13px;margin:4px 0}.pack-option.active{border-color:var(--gold);background:linear-gradient(145deg,rgba(91,57,107,.7),rgba(19,13,25,.85));box-shadow:inset 0 0 0 1px rgba(223,183,85,.24)}

/* No fill mode: a filled opacity/transform animation would leave the screen

#phase-fx{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0}
#phase-fx.nightfall{background:radial-gradient(circle at 50% -12%,rgba(24,28,66,.92),rgba(2,2,9,.97) 62%);animation:phase-veil 2.5s ease both}
#phase-fx.nightfall:after{content:"";position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 18% 32%,#fff8,transparent 60%),radial-gradient(1.5px 1.5px at 72% 22%,#fff7,transparent 60%),radial-gradient(1.5px 1.5px at 42% 12%,#fff6,transparent 60%),radial-gradient(1.5px 1.5px at 86% 44%,#fff5,transparent 60%);animation:phase-veil 2.5s ease both}
#phase-fx.dawnrise{background:linear-gradient(180deg,rgba(255,197,118,.6),rgba(148,72,88,.34) 52%,rgba(20,10,20,.15));animation:phase-veil 2.3s ease both}
@keyframes phase-veil{0%{opacity:0}22%{opacity:1}72%{opacity:1}100%{opacity:0}}
/* A plain cinematic cut: quick fade to black, a held breath, fade back in.
   Used between every daytime scene so the story never jump-cuts. */
#phase-fx.scene-cut{background:#04040a;animation:scene-cut 1.7s ease both}
@keyframes scene-cut{0%{opacity:0}14%,52%{opacity:1}100%{opacity:0}}
/* ── Gold gilding & final shine ─────────────────────────────────────────── */
.card-face{border:2px solid transparent;background:
  linear-gradient(#100b16,#100b16) padding-box,
  linear-gradient(145deg,#f4dc8d 0%,#8a6a24 22%,#ffe9a3 45%,#6e5318 68%,#e9c96f 100%) border-box;
  box-shadow:0 0 0 1px rgba(20,12,4,.9),0 10px 26px rgba(0,0,0,.5)}
.target-card-art{border:2px solid transparent;background:
  linear-gradient(#0d0913,#0d0913) padding-box,
  linear-gradient(150deg,#dcbd72,#6e551f 40%,#f0d68b 72%,#7a5c1d) border-box}
.final-card{border:2px solid transparent;background:
  linear-gradient(#0a0810,#0a0810) padding-box,
  linear-gradient(150deg,#dcbd72,#6e551f 45%,#f0d68b) border-box}
.mini-flip .card-face{border-width:2px}
.panel.ornate:after{content:"✦";position:absolute;top:9px;right:13px;color:rgba(223,183,85,.5);font-size:11px;pointer-events:none}
.room-code{background:linear-gradient(180deg,#fff3bd 15%,#e8c568 60%,#c9a552);-webkit-background-clip:text;background-clip:text;color:transparent}
.phase-ribbon h1{background:linear-gradient(180deg,#fdf6e2,#e8cf92 78%,#c9a552);-webkit-background-clip:text;background-clip:text;color:transparent}
.game-over-hero .victory-moon{animation:victory-float 3.4s ease-in-out infinite}
@keyframes victory-float{50%{transform:translateY(-7px);filter:drop-shadow(0 0 34px rgba(223,183,85,.55))}}
.avatar,.wolf-chip{box-shadow:inset 0 0 0 1px rgba(255,231,166,.14)}
/* Readability over the bright scenery: a soft dark halo hugs the heading
   block and key text rows, so the artwork stays untouched underneath. */
.phase-ribbon{position:relative;padding:10px 14px 12px;border-radius:22px;background:radial-gradient(ellipse 88% 100% at 50% 42%,rgba(5,4,11,.72),rgba(5,4,11,.38) 62%,transparent 78%)}
.phase-ribbon h1{text-shadow:0 3px 16px rgba(0,0,0,.85)}
.phase-ribbon p{text-shadow:0 2px 8px rgba(0,0,0,.9)}
.phase-ribbon .moon-number{text-shadow:0 1px 6px rgba(0,0,0,.9)}
.tap-hint{text-shadow:0 2px 8px rgba(0,0,0,.95)}
.sleep-card h2,.sleep-card p,.look-up h2,.look-up p{text-shadow:0 2px 10px rgba(0,0,0,.9)}
/* Fate card faces for the arrow reveal (everyone flips together). All type
   scales with the viewport so the smaller landscape card never shouts. */
.lover-face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:min(1.8svh,9px);padding:9%;text-align:center;background:linear-gradient(165deg,#221228 0%,#0c0a13 70%);overflow:hidden}
.lover-face b{font-size:clamp(22px,8svh,44px);line-height:1;color:var(--violet);filter:drop-shadow(0 0 14px rgba(160,120,220,.4))}
.lover-face.chosen b{color:#ff8eb7;filter:drop-shadow(0 0 18px rgba(255,100,160,.55));animation:heartbeat 1.7s ease-in-out 1.75s infinite}
.lover-face strong{font-family:Georgia,serif;font-size:clamp(12px,3.8svh,21px);line-height:1.15;color:var(--gold-2)}
.lover-face em{font-family:Georgia,serif;font-style:normal;font-size:clamp(14px,4.6svh,26px);line-height:1.1;color:#ffc2d6}
.lover-face span{color:var(--muted);font-size:clamp(8px,2.4svh,11px);line-height:1.45}
.lover-face.chosen{background:linear-gradient(165deg,#341328 0%,#12060f 70%)}
.lover-face.chosen:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 46% 34%,rgba(255,120,170,.55),transparent 58%);opacity:0;animation:arrow-flash .9s ease .7s both;pointer-events:none}
@keyframes arrow-flash{25%{opacity:1}100%{opacity:0}}
/* ── Phase glow: the screen itself breathes the active colour ───────────
   No second moon fights the artwork: a soft pulsing aura around the screen
   edges says whose hour it is — blood for the pack, violet for the Seer,
   rose for Cupid, green for the Witch, amber for daylight. */
#glow{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1.4s ease;animation:glow-pulse 3.6s ease-in-out infinite;--glow:rgba(223,183,85,.34)}
#glow:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 55% at 50% -14%,var(--glow),transparent 62%)}
#glow:after{content:"";position:absolute;inset:0;background:radial-gradient(130% 46% at 50% 112%,var(--glow),transparent 58%);opacity:.55}
@keyframes glow-pulse{50%{opacity:.45}}
body[data-phase="role-reveal"] #glow,body[data-phase^="setup-"] #glow,body[data-phase^="night-"] #glow,body[data-phase="resolution"] #glow,body[data-phase="dawn"] #glow,body[data-phase="sheriff-vote"] #glow,body[data-phase^="day-"] #glow,body[data-phase="game-over"] #glow,body[data-phase="session-over"] #glow{opacity:.9}
body[data-phase="night-wolves"] #glow,body[data-phase="resolution"] #glow{--glow:rgba(196,52,38,.4)}
body[data-phase="setup-cupid"] #glow,body[data-phase="setup-lovers"] #glow{--glow:rgba(230,106,156,.32)}
body[data-phase="night-seer"] #glow{--glow:rgba(150,112,232,.34)}
body[data-phase="night-witch"] #glow{--glow:rgba(104,190,132,.3)}
body[data-phase="setup-thief"] #glow{--glow:rgba(223,183,85,.3)}
body[data-phase="dawn"] #glow{--glow:rgba(255,172,92,.36)}
body[data-phase="sheriff-vote"] #glow,body[data-phase^="day-"] #glow{--glow:rgba(255,214,130,.3)}
body[data-phase="game-over"] #glow{--glow:rgba(223,183,85,.36)}
body[data-phase="session-over"] #glow{--glow:rgba(255,214,130,.34)}
/* Coloured night vignettes so the whole screen breathes with the phase. */
body[data-phase="night-wolves"]:after,body[data-phase="resolution"]:after{background:radial-gradient(circle at 50% 6%,rgba(190,45,32,.24),transparent 44%),linear-gradient(180deg,transparent 52%,rgba(22,1,0,.64))}
body[data-phase="setup-cupid"]:after,body[data-phase="setup-lovers"]:after{background:radial-gradient(circle at 50% 6%,rgba(226,100,150,.17),transparent 42%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.58))}
body[data-phase="night-seer"]:after{background:radial-gradient(circle at 50% 6%,rgba(140,105,220,.19),transparent 42%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.58))}
body[data-phase="night-witch"]:after{background:radial-gradient(circle at 50% 6%,rgba(90,180,120,.15),transparent 42%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.6))}
/* ── The town square ─────────────────────────────────────────────────────
   Painted character sprites stand in the middle of the screen. Each phone
   dresses the crowd according to what its owner truly knows; ghosts stay
   where they fell. Tap a character to see their name. */
#village{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);height:min(64svh,460px);z-index:1;pointer-events:none}
.square{position:absolute;inset:0;opacity:0;animation:square-in 1.4s ease .1s both}
@keyframes square-in{to{opacity:1}}
.sprite{position:absolute;transform:translateX(-50%);border:0;padding:0;background:none;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sprite img{display:block;height:calc(var(--base,min(15.5svh,136px))*var(--s,1));width:auto;max-width:none;pointer-events:none;
  filter:drop-shadow(0 7px 13px rgba(0,0,0,.85)) drop-shadow(0 0 24px rgba(0,0,0,.5));
  animation:sprite-sway var(--sway,4s) ease-in-out var(--sd,0s) infinite alternate;transform-origin:50% 100%}
@keyframes sprite-sway{from{transform:rotate(-.8deg)}to{transform:rotate(.8deg)}}
.sprite:after{content:"";position:absolute;left:50%;bottom:-5px;width:76%;height:14px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);z-index:-1}
.sprite:active img{filter:drop-shadow(0 7px 13px rgba(0,0,0,.85)) drop-shadow(0 0 26px rgba(255,224,139,.34))}
/* name plate on tap */
.sprite-name{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%) translateY(5px);white-space:nowrap;padding:6px 11px;border-radius:999px;border:1px solid rgba(223,183,85,.45);background:rgba(8,6,12,.92);color:var(--gold-2);font-family:Georgia,serif;font-size:13px;opacity:0;transition:opacity .25s ease,transform .25s ease;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.sprite.named .sprite-name{opacity:1;transform:translateX(-50%) translateY(0)}
/* the marks above heads */
.marks{position:absolute;left:50%;bottom:calc(100% - 16px);transform:translateX(-50%);display:flex;gap:7px;pointer-events:none;z-index:3}
.mark{font-size:17px;line-height:1}
/* the Sheriff's actual badge floats above their head */
.sprite .mark.badge{width:min(8.5svh,40px);height:auto;max-width:none;filter:drop-shadow(0 1px 3px #000) drop-shadow(0 0 9px rgba(255,205,80,.95));animation:badge-shine 3s ease-in-out infinite}
@keyframes badge-shine{50%{filter:drop-shadow(0 1px 3px #000) drop-shadow(0 0 18px rgba(255,215,100,1))}}
@keyframes badge-glint{50%{text-shadow:0 0 16px rgba(255,215,100,1),0 1px 3px #000}}
.sprite.bound img{filter:drop-shadow(0 7px 13px rgba(0,0,0,.85)) drop-shadow(0 0 22px rgba(255,110,160,.42))}
/* ghosts stay where they fell, their true card revealed */
.sprite.ghost img{opacity:.66;filter:grayscale(.35) brightness(1.12) sepia(.14) hue-rotate(180deg) saturate(.7) drop-shadow(0 0 20px rgba(150,180,255,.36));animation:ghost-drift 5.2s ease-in-out var(--sd,0s) infinite alternate}
@keyframes ghost-drift{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.sprite.ghost:after{opacity:.4}
.sprite.ghost .sprite-name{border-color:rgba(150,180,255,.4);color:#c9d6ff}
.sprite.fresh img{filter:grayscale(.2) brightness(1.05) drop-shadow(0 0 24px rgba(200,60,50,.5))}
/* daylight: deepen the ground shadows so the crowd anchors on a bright wash */
.square[data-mood="day"] .sprite:after{background:radial-gradient(ellipse,rgba(20,12,4,.5),transparent 70%)}
.dock-note{text-align:center;color:var(--gold-2);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;padding:0 0 8px;text-shadow:0 2px 8px #000}
/* ── Night whispers ─────────────────────────────────────────────────────── */
.whisper{width:100%;display:flex;gap:12px;align-items:center;text-align:left;margin:12px 0;padding:14px 15px;border:1px solid rgba(223,183,85,.34);border-radius:16px;background:linear-gradient(150deg,rgba(52,38,29,.82),rgba(15,11,14,.9) 68%);box-shadow:0 12px 34px rgba(0,0,0,.4),inset 0 1px rgba(255,236,190,.07);transition:border-color .3s ease,transform .12s ease}
.whisper:active{transform:scale(.985)}
.whisper.open{border-color:rgba(255,224,139,.6);background:linear-gradient(150deg,rgba(66,49,33,.9),rgba(17,12,15,.94) 70%)}
.whisper-mark{width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(223,183,85,.42);background:radial-gradient(circle,rgba(101,68,40,.85),rgba(26,17,15,.9) 72%);color:var(--gold-2);font-size:19px;box-shadow:0 0 16px rgba(223,183,85,.14)}
.whisper.open .whisper-mark{animation:whisper-glow 2.4s ease-in-out infinite}
@keyframes whisper-glow{50%{box-shadow:0 0 26px rgba(223,183,85,.32)}}
.whisper-copy{min-width:0;flex:1}
.whisper-copy strong{display:block;color:var(--gold-2);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px}
.whisper-copy span{display:block;font-family:Georgia,serif;font-style:italic;font-size:14px;line-height:1.5;color:#eadfca}
.whisper:not(.open) .whisper-copy span{font-size:11.5px;color:var(--muted);font-style:normal;font-family:Inter,ui-sans-serif,sans-serif}
.whisper.compact{padding:11px 13px;margin:8px 0}
.whisper.compact .whisper-mark{width:36px;height:36px;font-size:15px}
/* ── The dawn reveal: one card, one story ──────────────────────────────── */
.dawn-screen{display:flex;flex-direction:column}
.death-reveal{display:grid;gap:26px;justify-items:center;margin:4vh 0 12px}
.death-hero{width:min(72vw,300px)}
.death-hero.staged{animation:death-in 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(1.2s + var(--stage,0)*2.2s)}
@keyframes death-in{from{opacity:0;transform:translateY(22px) scale(.94)}}
.death-frame{position:relative;aspect-ratio:2/3;border-radius:22px;overflow:hidden;border:2px solid transparent;background:
  linear-gradient(#100b16,#100b16) padding-box,
  linear-gradient(145deg,#f4dc8d 0%,#8a6a24 22%,#ffe9a3 45%,#6e5318 68%,#e9c96f 100%) border-box;
  box-shadow:0 30px 80px rgba(0,0,0,.72),0 0 44px rgba(160,40,40,.14)}
.death-frame img{width:100%;height:100%;object-fit:cover;filter:saturate(.82) brightness(.86)}
.death-pall{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 20%,transparent 42%,rgba(6,2,6,.62)),linear-gradient(180deg,rgba(10,4,8,.24),transparent 30%,rgba(6,2,6,.7) 82%)}
.death-haze{position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 62%,rgba(96,190,120,.3),transparent 70%);mix-blend-mode:screen;animation:haze-breathe 3.4s ease-in-out infinite}
@keyframes haze-breathe{50%{opacity:.55}}
.death-claw{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 2px 5px rgba(0,0,0,.7))}
.death-claw .slash{opacity:0;transform:scaleY(0);transform-box:fill-box;transform-origin:top center}
.staged .death-claw .slash{animation:slash-cut .3s cubic-bezier(.6,0,.8,1) both}
.death-hero:not(.staged) .death-claw .slash{opacity:.94;transform:none}
.staged .death-claw .s1{animation-delay:calc(2.4s + var(--stage,0)*2.2s)}
.staged .death-claw .s2{animation-delay:calc(2.55s + var(--stage,0)*2.2s)}
.staged .death-claw .s3{animation-delay:calc(2.7s + var(--stage,0)*2.2s)}
@keyframes slash-cut{from{opacity:0;transform:scaleY(0)}60%{opacity:1}to{opacity:.94;transform:scaleY(1)}}
.death-plate{position:absolute;left:7%;right:7%;bottom:6%;padding:12px 10px;text-align:center;background:linear-gradient(180deg,rgba(10,6,12,.32),rgba(6,4,9,.92) 46%);border-top:1px solid rgba(223,183,85,.4);border-radius:10px}
.death-plate strong{display:block;font-family:Georgia,serif;font-size:24px;color:#f4e2d2;text-shadow:0 2px 9px #000}
.death-plate span{display:block;margin-top:4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#cbb59a}
.no-deaths.staged{animation:death-in 1s ease both;animation-delay:1s}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ═══════════════════════════════════════════════════════════════════════
   LANDSCAPE LIVING VILLAGE
   The game is played sideways: the town square fills the screen, a compact
   phase strip sits top-left, contextual controls in a narrow right rail,
   one action button bottom-right. Instructions live in the narrator's
   voice — the screen shows state, not prose.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── Rotate shield: the game is landscape; portrait asks for a turn ────── */
#rotate-shield{position:fixed;inset:0;z-index:300;display:none;place-content:center;text-align:center;background:radial-gradient(circle at 50% 40%,#131329,#04040c 75%)}
#rotate-shield span{display:block;font-size:58px;color:var(--gold-2);animation:rotate-hint 2.2s ease-in-out infinite}
#rotate-shield p{color:var(--muted);margin:12px 0 0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
@keyframes rotate-hint{0%,18%{transform:rotate(0)}52%,100%{transform:rotate(90deg)}}
@media(orientation:portrait){body:not([data-phase="home"]) #rotate-shield{display:grid}}

/* ── Animated character sheets ──────────────────────────────────────────
   Each role ships one sheet: 4 frames × 5 rows (idle, walk, act, bound,
   death). The row is fixed inline via background-position-y; loops drive
   background-position-x through the frames with steps(). */
.ss{display:block;width:calc(var(--base,min(20svh,160px))*var(--s,1));height:calc(var(--base,min(20svh,160px))*var(--s,1));
  background-repeat:no-repeat;background-size:400% 500%;pointer-events:none;transform-origin:50% 100%;
  filter:drop-shadow(0 7px 13px rgba(0,0,0,.85)) drop-shadow(0 0 24px rgba(0,0,0,.5));
  animation:sprite-sway var(--sway,4s) ease-in-out var(--sd,0s) infinite alternate}
.ss.loop{animation:ss-cycle var(--ssd,1.05s) steps(4,jump-none) var(--ssdel,0s) infinite,
  sprite-sway var(--sway,4s) ease-in-out var(--sd,0s) infinite alternate}
.ss.oneshot{animation:ss-once var(--ssd,1.15s) steps(4,jump-none) both}
@keyframes ss-cycle{from{background-position-x:0%}to{background-position-x:100%}}
@keyframes ss-once{from{background-position-x:0%}to{background-position-x:100%}}
.sprite.ghost .ss{opacity:.62;filter:grayscale(.4) brightness(1.14) sepia(.12) hue-rotate(180deg) saturate(.65) drop-shadow(0 0 20px rgba(150,180,255,.36));
  animation:ghost-drift 5.2s ease-in-out var(--sd,0s) infinite alternate}
.sprite.fresh .ss{opacity:.85;filter:grayscale(.2) brightness(1.05) drop-shadow(0 0 24px rgba(200,60,50,.5));animation:ghost-drift 5.2s ease-in-out infinite alternate}
.sprite.bound .ss{filter:drop-shadow(0 7px 13px rgba(0,0,0,.85)) drop-shadow(0 0 22px rgba(255,110,160,.42))}
.sprite.self:after{background:radial-gradient(ellipse,rgba(223,183,85,.42),transparent 70%)}
/* newcomers walk in from the edge of the square */
.sprite.arrive{animation:arrive-walk 1.9s cubic-bezier(.3,.55,.3,1) both}
@keyframes arrive-walk{from{transform:translateX(calc(-50% - 58vw));opacity:0}12%{opacity:1}to{transform:translateX(-50%);opacity:1}}
.square.cinematic .sprite:not(.fresh) .ss{animation:crowd-recoil 1.9s ease-in-out infinite}
.square.cinematic .sprite.fresh{opacity:0;animation:fresh-ghost-in 1.1s ease calc(3.5s + var(--fresh,0)*4.4s) both}
@keyframes crowd-recoil{0%,100%{transform:translateY(0) rotate(0)}24%{transform:translateY(-2px) rotate(-1.2deg)}35%{transform:translateY(1px) rotate(1deg)}}
@keyframes fresh-ghost-in{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:.72;transform:translateX(-50%) translateY(-5px)}}

/* ── The square as selection surface ────────────────────────────────────
   When a choice is open: legal targets stay lit, others dim, the chosen
   step forward on a glowing ring, and every name plate shows. */
.square.named-all .sprite-name{opacity:1;transform:translateX(-50%) translateY(0);font-size:11px;padding:4px 9px}
.square{pointer-events:none}
.square .sprite{pointer-events:auto}
.square.selecting .sprite.off{opacity:.38;filter:saturate(.35)}
.square.selecting .sprite.off .sprite-name{opacity:.4}
.sprite.can-pick{cursor:pointer}
.sprite.can-pick .ss{filter:drop-shadow(0 7px 13px rgba(0,0,0,.85)) drop-shadow(0 0 18px rgba(255,224,139,.22))}
.sprite{transition:transform .25s ease}
.sprite.picked{transform:translateX(-50%) scale(1.14);z-index:14!important}
.sprite.picked .sprite-name{border-color:rgba(255,224,139,.85);color:#fff3c4}
.pick-ring{position:absolute;left:50%;bottom:-9px;width:96%;height:22px;transform:translateX(-50%);border-radius:50%;pointer-events:none;
  border:2px solid rgba(255,224,139,.75);box-shadow:0 0 18px rgba(255,224,139,.5),inset 0 0 14px rgba(255,224,139,.3);animation:ring-pulse 1.6s ease-in-out infinite}
@keyframes ring-pulse{50%{box-shadow:0 0 30px rgba(255,224,139,.75),inset 0 0 20px rgba(255,224,139,.42);opacity:.75}}
.sprite.forbidden{opacity:.25;filter:grayscale(.8)}
/* The pack's tally and the night's victim are drawn, not typed. Colour
   emoji render in the system font's own cartoon palette, which reads as a
   sticker pasted over painted art — these keep the game's own colours. */
.mark.paw{display:inline-flex;gap:3px;align-items:center}
.mark.paw i{width:6px;height:9px;border-radius:60% 60% 45% 45%;background:linear-gradient(180deg,#ff8f7d,#b3242c);
  box-shadow:0 0 7px rgba(200,60,50,.85),inset 0 -1px 1px rgba(0,0,0,.45);transform:rotate(-8deg)}
.mark.paw i:nth-child(2){transform:rotate(0deg) translateY(-1.5px)}
.mark.paw i:nth-child(3){transform:rotate(8deg)}
.mark.doom{width:15px;height:15px;position:relative;filter:drop-shadow(0 0 9px rgba(220,70,50,.9))}
.mark.doom::before,.mark.doom::after{content:'';position:absolute;inset:0 46%;border-radius:2px;background:linear-gradient(180deg,#ffb3a4,#c02a30)}
.mark.doom::before{transform:rotate(45deg)}
.mark.doom::after{transform:rotate(-45deg)}
/* Pack roster chip: a claw score instead of a 🐺 emoji. */
.claw-mark{width:11px;height:12px;position:relative;flex:none}
.claw-mark::before,.claw-mark::after{content:'';position:absolute;top:0;bottom:0;width:2px;border-radius:2px;
  background:linear-gradient(180deg,rgba(255,198,206,.95),rgba(167,53,70,.2))}
.claw-mark::before{left:2px;transform:rotate(9deg)}
.claw-mark::after{right:2px;transform:rotate(-9deg)}

/* ── The stage shell ────────────────────────────────────────────────────── */
.screen.stage-screen{width:100%;max-width:none;padding:0;height:100svh;height:100dvh;min-height:0;overflow:hidden}
.phase-ribbon.strip{position:fixed;z-index:18;top:10px;left:calc(10px + env(safe-area-inset-left,0px));margin:0;text-align:left;padding:7px 14px 9px;border-radius:16px;max-width:44vw}
.phase-ribbon.strip h1{font-size:clamp(17px,5svh,26px);margin:2px 0 0;line-height:1}
.phase-ribbon.strip .moon-number{font-size:9px}
.stage-rail{position:fixed;z-index:17;right:calc(10px + env(safe-area-inset-right,0px));top:62px;bottom:72px;width:min(224px,27vw);
  display:flex;flex-direction:column;justify-content:flex-start;gap:8px;overflow:hidden auto;padding:2px;scrollbar-width:none}
.stage-rail::-webkit-scrollbar{display:none}
/* The rail scrolls when its controls outgrow the band — clipped, unreachable
   options are never acceptable. Auto margins keep short content centred. */
.stage-rail>*{flex:0 0 auto}
.stage-rail>:first-child{margin-top:auto}
.stage-rail>:last-child{margin-bottom:auto}
.stage-foot{position:fixed;z-index:17;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(224px,27vw);text-align:center}
.stage-foot .btn{width:100%}
.stage-foot .tap-hint{padding:12px 4px}
.stage-foot .dock-note{padding-bottom:7px}
.rail-chip{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid rgba(223,183,85,.3);border-radius:13px;background:rgba(8,7,14,.82);backdrop-filter:blur(8px)}
.rail-chip b{font-size:17px;color:var(--gold-2)}
.rail-chip strong{font-size:12px}
.rail-chip.doomed{border-color:rgba(190,65,83,.45);background:rgba(50,12,20,.66)}
.rail-chip.doomed b{color:#ff9c8a}
.rail-chip.ghostly{border-color:rgba(150,180,255,.35)}.rail-chip.ghostly b{color:#c9d6ff}
.rail-note{padding:9px 11px;border-radius:12px;background:rgba(6,5,12,.72);border:1px solid rgba(255,255,255,.08);color:var(--muted);font-size:10.5px;line-height:1.45}
/* First-game training wheels. Deliberately quieter than a panel: this is a
   whisper in the margin, and it retires itself once the mechanic is used. */
.hint{margin:0;padding:7px 10px;border-left:2px solid rgba(223,183,85,.5);border-radius:0 8px 8px 0;
  background:linear-gradient(90deg,rgba(223,183,85,.12),transparent);color:#e4d6bd;
  font-family:Georgia,serif;font-style:italic;font-size:11px;line-height:1.4;
  animation:hint-in .5s ease both}
@keyframes hint-in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.rail-emblem{width:58px;height:58px;margin:0 auto;display:grid;place-content:center;border-radius:50%;font-size:26px;color:var(--gold-2);
  border:1px solid rgba(223,183,85,.45);background:radial-gradient(circle,rgba(83,51,99,.85),rgba(9,8,15,.9) 70%);box-shadow:0 0 26px rgba(124,74,164,.3);animation:emblem-pulse 2.4s ease-in-out infinite}
.rail-emblem.cupid{color:#ff8eb7;border-color:rgba(229,101,147,.5);box-shadow:0 0 26px rgba(255,89,154,.3)}
.rail-emblem.seer{color:var(--violet)}
@keyframes emblem-pulse{50%{transform:scale(.93);opacity:.8}}
.heart-slots{display:flex;justify-content:center;gap:10px}
.heart-slots b{width:40px;height:40px;display:grid;place-content:center;border-radius:50%;font-size:19px;color:rgba(255,142,183,.28);border:1px dashed rgba(229,101,147,.4);background:rgba(30,10,24,.5)}
.heart-slots b.filled{color:#ff8eb7;border-style:solid;box-shadow:0 0 16px rgba(255,89,154,.4);animation:heartbeat 1.7s ease-in-out infinite}
.rail-pack{margin:0;justify-content:flex-start}
.rail-potion{min-height:68px;padding:7px 10px;display:grid;grid-template-columns:52px 1fr;align-items:center;gap:7px;text-align:left;overflow:hidden;position:relative}
.rail-potion img{width:52px;height:52px;object-fit:contain;grid-row:1/3;filter:drop-shadow(0 5px 10px #000);transition:transform .35s ease,filter .35s ease}
.rail-potion:hover img,.rail-potion.selected img{transform:translateY(-3px) rotate(-3deg) scale(1.08)}
.rail-potion.heal.selected img{filter:drop-shadow(0 0 16px rgba(82,255,150,.8))}
.rail-potion.poison.selected img{filter:drop-shadow(0 0 16px rgba(206,74,255,.8))}
.rail-potion b{font-size:19px;margin:0}
.rail-potion strong{font-size:12px}
.rail-potion span{font-size:9px;margin:0;color:var(--gold-2)}
.stage-rail .btn.mini{width:100%}
.stage-rail .whisper{margin:0}
.selected-btn{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(223,183,85,.5)}
.moon-loader.mini{width:20px;height:20px;margin:0;padding:2px;flex:0 0 auto}

/* ── The lobby: the village assembles ──────────────────────────────────── */
.lobby-invite{position:fixed;z-index:16;left:calc(10px + env(safe-area-inset-left,0px));top:62px;width:min(212px,25vw);margin:0;padding:12px;text-align:center}
.lobby-invite .room-code{font-size:clamp(21px,3.4vw,30px);letter-spacing:.13em;margin:0 0 7px}
.lobby-invite .qr-wrap{width:min(118px,13vw);margin:0 auto 2px;padding:6px}
.stage-rail .pack-grid{margin:0;gap:5px}
.stage-rail .pack-option{min-height:60px;padding:6px 4px}
.stage-rail .role-toggles{margin:0 -2px;padding:2px 2px 6px}
.stage-rail .role-toggle{width:64px;flex:0 0 64px}
.stage-rail .deck-line{font-size:10px;padding:8px 10px}
.stage-rail .ledger{margin:0}
.stage-rail .field .input{height:42px;padding:0 9px;font-size:12px}

/* ── Dealing your one card ─────────────────────────────────────────────── */
.deal-screen .deal-stage{min-height:100svh;display:grid;place-items:center;padding:12px}
.deal-stage .flip-wrap{width:calc(min(66svh,430px)*2/3);margin:0}
.deal-deck{position:fixed;left:max(24px,12vw);top:50%;width:calc(min(38svh,250px)*2/3);aspect-ratio:2/3;transform:translateY(-50%);z-index:1;pointer-events:none}
.deal-deck i{position:absolute;inset:0;border-radius:13px;background:url("assets/card-back.webp") center/cover;border:1px solid rgba(255,223,135,.4);box-shadow:0 12px 28px rgba(0,0,0,.55)}
.deal-deck i:nth-child(1){transform:rotate(-11deg) translate(-7%,1%)}
.deal-deck i:nth-child(2){transform:rotate(-4deg)}
.deal-deck i:nth-child(3){transform:rotate(4deg) translate(5%,-1%)}
.deal-deck i:nth-child(4){transform:rotate(12deg) translate(11%,1%)}
.flip-wrap.dealt{animation:deal-fly .9s cubic-bezier(.18,.72,.2,1) both}
@keyframes deal-fly{from{transform:translate(-42vw,-3vh) rotate(-26deg) scale(.62);opacity:0}30%{opacity:1}}
.flip-wrap:has(.flip-card.flipped){animation:card-arc .8s cubic-bezier(.3,.6,.3,1)}
@keyframes card-arc{35%{transform:translateY(-22px) scale(1.05)}}
.role-peek .flip-wrap{width:calc(min(62svh,400px)*2/3)}

/* ── Eyes closed: the sleeping village ─────────────────────────────────── */
.night-sleep{width:100%;max-width:none;padding:0;min-height:100svh}
.sleep-scene{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;background:radial-gradient(circle at 50% 30%,#0e1327,#04050e 72%)}
.sleep-moon{width:min(26svh,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff7d9,#e8d49a 52%,#8d7a4b);box-shadow:0 0 70px rgba(240,220,160,.32);animation:moon-breathe 5.5s ease-in-out infinite}
@keyframes moon-breathe{50%{box-shadow:0 0 100px rgba(240,220,160,.48);transform:translateY(-5px)}}
.sleep-stars{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(1.6px 1.6px at 12% 24%,#fff9,transparent 60%),radial-gradient(1.4px 1.4px at 78% 16%,#fff8,transparent 60%),
  radial-gradient(1.8px 1.8px at 32% 12%,#fff7,transparent 60%),radial-gradient(1.3px 1.3px at 64% 34%,#fff6,transparent 60%),
  radial-gradient(1.5px 1.5px at 88% 42%,#fff7,transparent 60%),radial-gradient(1.4px 1.4px at 22% 52%,#fff5,transparent 60%),
  radial-gradient(1.7px 1.7px at 48% 22%,#fff8,transparent 60%),radial-gradient(1.2px 1.2px at 8% 68%,#fff5,transparent 60%);
  animation:star-twinkle 4.4s ease-in-out infinite}
@keyframes star-twinkle{50%{opacity:.55}}
/* Two closed lids, drawn. The old "— ◡ —" was an ASCII emoticon sitting in
   the middle of a painted moonlit village. */
.sleep-eyes{margin-top:22px;display:flex;gap:26px;opacity:.8}
.sleep-eyes i{width:34px;height:15px;border-bottom:2px solid var(--violet);border-radius:0 0 40px 40px;
  box-shadow:0 6px 16px -6px rgba(194,154,239,.7);animation:lid-settle 6s ease-in-out infinite}
.sleep-eyes i:last-child{animation-delay:-3s}
@keyframes lid-settle{50%{transform:scaleY(.7);opacity:.72}}
.sleep-line{color:var(--muted);font-size:12px;line-height:1.5;margin:12px auto 0;max-width:320px}

/* ── The storyteller speaks ────────────────────────────────────────────── */
/* The narrator's announcement is its own cutscene: an opaque night backdrop
   (the village is hidden meanwhile), the portrait alone at centre, fading in
   and out with the scene cut. */
.storyteller-stage{position:relative;z-index:16;pointer-events:none;min-height:100svh;display:grid;place-content:center;justify-items:center;text-align:center;gap:14px;padding:16px;
  background:radial-gradient(circle at 50% 40%,#141230,#05050e 74%)}
.storyteller-mark{width:min(34svh,180px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid rgba(223,183,85,.55);
  box-shadow:0 0 46px rgba(124,74,164,.4),0 18px 50px #000;animation:teller-sway 4.6s ease-in-out infinite}
.storyteller-mark img{width:100%;height:100%;object-fit:cover;object-position:top}
@keyframes teller-sway{50%{transform:translateY(-7px)}}
/* Speech is shown, not written: the portrait breathes light while the
   narrator's recorded voice carries the story. */
.storyteller-mark.speaking{animation:teller-sway 4.6s ease-in-out infinite,teller-glow 2.2s ease-in-out infinite}
@keyframes teller-glow{50%{box-shadow:0 0 85px rgba(194,154,239,.66),0 18px 50px #000;border-color:rgba(255,231,166,.8)}}

/* ── Local action effects ────────────────────────────────────────────────
   These never leave the acting phone. They make a tap feel physical while
   sound and vibration remain hard-gated against secret leaks. */
#scene-fx{position:fixed;inset:0;z-index:64;pointer-events:none;overflow:hidden}
#scene-fx:before,#scene-fx:after{content:"";position:absolute;left:var(--fx-x,50vw);top:var(--fx-y,50vh);pointer-events:none}
#scene-fx.heart-pick:before{width:54px;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff 0 7%,#ff74ad 10% 34%,transparent 38%);filter:drop-shadow(0 0 20px #ff5ca3);animation:fx-heart .68s ease-out both}
@keyframes fx-heart{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}45%{opacity:1;transform:translate(-50%,-65%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-110%) scale(.75)}}
#scene-fx.cupid-loose:before{left:-24vw;top:54vh;width:min(40vw,420px);height:110px;background:url("assets/sprites/props/arrow.png") center/contain no-repeat;filter:drop-shadow(0 0 14px rgba(255,95,160,.85));animation:fx-arrow 1.5s cubic-bezier(.18,.72,.2,1) both}
#scene-fx.cupid-loose:after{inset:0;left:0;top:0;background:radial-gradient(circle at 50% 50%,rgba(255,100,165,.36),transparent 5%);animation:fx-pink-flash 1.5s ease both}
@keyframes fx-arrow{0%{transform:translate(-10vw,18vh) rotate(-12deg);opacity:0}18%{opacity:1}72%{transform:translate(68vw,-7vh) rotate(3deg);opacity:1}100%{transform:translate(118vw,-15vh) rotate(8deg);opacity:0}}
@keyframes fx-pink-flash{0%,58%,100%{opacity:0}72%{opacity:1;background-size:180% 180%}}
#scene-fx.seer-flash:before{width:10px;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 0 rgba(188,126,255,.8);animation:fx-orb .82s ease-out both}
@keyframes fx-orb{0%{opacity:1;box-shadow:0 0 0 0 rgba(188,126,255,.8)}100%{opacity:0;box-shadow:0 0 0 42vw rgba(188,126,255,0)}}
#scene-fx.wolf-pounce:before{width:140px;height:180px;transform:translate(-50%,-50%) rotate(-18deg);background:repeating-linear-gradient(96deg,transparent 0 23px,rgba(255,76,74,.88) 25px 31px,transparent 33px 48px);clip-path:polygon(4% 0,100% 8%,82% 100%,0 88%);filter:drop-shadow(0 0 12px #8f1018);animation:fx-claw .85s cubic-bezier(.2,.8,.2,1) both}
@keyframes fx-claw{from{opacity:0;transform:translate(-80%,-80%) rotate(-18deg) scaleY(.2)}45%{opacity:1}to{opacity:0;transform:translate(-42%,-42%) rotate(-18deg) scaleY(1.1)}}
#scene-fx.heal-bloom:before,#scene-fx.poison-mark:before,#scene-fx.witch-dual:before{width:18px;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);animation:fx-spell 1.2s ease-out both}
#scene-fx.heal-bloom:before{box-shadow:0 0 0 0 rgba(61,246,133,.75)}
#scene-fx.poison-mark:before{box-shadow:0 0 0 0 rgba(194,54,225,.72)}
#scene-fx.witch-dual:before{box-shadow:0 0 0 0 rgba(61,246,133,.7),0 0 0 0 rgba(194,54,225,.7)}
@keyframes fx-spell{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.2);box-shadow:0 0 0 32vw transparent}}
#scene-fx.vote-token:before,#scene-fx.badge-pass:before{width:70px;height:70px;background-position:center;background-size:contain;background-repeat:no-repeat;filter:drop-shadow(0 10px 12px #000);animation:fx-token 1.15s cubic-bezier(.22,.7,.3,1) both}
#scene-fx.vote-token:before{background-image:url("assets/sprites/props/vote-token.png")}
#scene-fx.badge-pass:before{background-image:url("assets/sprites/props/badge.png")}
@keyframes fx-token{from{opacity:0;transform:translate(-50%,-90vh) rotate(-34deg) scale(.7)}45%{opacity:1;transform:translate(-50%,-52%) rotate(8deg) scale(1.14)}62%{transform:translate(-50%,-47%) rotate(-3deg) scale(.97)}74%{transform:translate(-50%,-50%) rotate(1deg) scale(1.02)}to{opacity:0;transform:translate(-50%,-42%) rotate(0) scale(.9)}}
/* The elected Sheriff's badge descends onto them with a golden burst. */
#scene-fx.badge-crown:before{width:min(20svh,110px);aspect-ratio:1;background:url("assets/sprites/props/badge.png") center/contain no-repeat;filter:drop-shadow(0 0 22px rgba(255,215,110,.9)) drop-shadow(0 8px 12px #000);animation:fx-crown 2.4s cubic-bezier(.25,.75,.25,1) both}
@keyframes fx-crown{0%{opacity:0;transform:translate(-50%,-46vh) scale(.5) rotate(-14deg)}28%{opacity:1}56%{transform:translate(-50%,-58%) scale(1.18) rotate(4deg)}70%{transform:translate(-50%,-52%) scale(1) rotate(0)}86%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(.72)}}
#scene-fx.badge-crown:after{width:12px;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 0 rgba(255,215,110,.7);animation:fx-crown-ring 1s ease-out 1.3s both}
@keyframes fx-crown-ring{0%{opacity:1;box-shadow:0 0 0 0 rgba(255,215,110,.7)}100%{opacity:0;box-shadow:0 0 0 34vw rgba(255,215,110,0)}}
/* Cupid's arrow crosses the whole screen, strikes the face-down fate card
   and bursts into pink smoke and hearts — everyone's phones in unison. */
#scene-fx.cupid-strike:before{left:0;top:calc(var(--fx-y,50vh) - 50px);width:min(38vw,340px);height:100px;background:url("assets/sprites/props/arrow.png") center/contain no-repeat;filter:drop-shadow(0 0 16px rgba(255,95,160,.9));animation:fx-strike-arrow 1.45s cubic-bezier(.3,.5,.35,1) both}
@keyframes fx-strike-arrow{0%{opacity:0;transform:translate(-46vw,12vh) rotate(-12deg)}16%{opacity:1}80%{opacity:1;transform:translate(calc(var(--fx-x,50vw) - min(38vw,340px) + 30px),0) rotate(0)}100%{opacity:0;transform:translate(calc(var(--fx-x,50vw) - min(38vw,340px) + 26px),2px) rotate(0)}}
#scene-fx.cupid-strike:after{content:"♥";left:var(--fx-x,50vw);top:var(--fx-y,50vh);font-size:34px;line-height:1;color:#ff8eb7;transform:translate(-50%,-50%);text-shadow:0 0 22px #ff4f98,-52px -44px 0 rgba(255,140,180,.95),50px -38px 0 rgba(255,110,165,.9),-38px 34px 0 rgba(255,160,195,.85),44px 40px 0 rgba(255,120,170,.9),0 -60px 0 rgba(255,150,190,.9);animation:fx-strike-burst 1.5s ease-out 1.3s both}
@keyframes fx-strike-burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2);filter:blur(0)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}55%{opacity:.9;transform:translate(-50%,-62%) scale(1.4);filter:blur(1px)}100%{opacity:0;transform:translate(-50%,-95%) scale(1.9);filter:blur(5px)}}
#scene-fx.hunter-shot:before{left:-12vw;top:var(--fx-y,50vh);width:125vw;height:4px;transform:rotate(-3deg);background:linear-gradient(90deg,transparent,#fff 30%,#d7b46a 70%,transparent);box-shadow:0 0 15px #fff;animation:fx-shot .78s ease-out both}
#scene-fx.hunter-shot:after{inset:0;left:0;top:0;background:#fff;animation:fx-muzzle .34s ease-out both}
@keyframes fx-shot{from{opacity:0;transform:translateX(-35vw) rotate(-3deg)}20%{opacity:1}to{opacity:0;transform:translateX(35vw) rotate(-3deg)}}
@keyframes fx-muzzle{from{opacity:.65}to{opacity:0}}

/* ── Dawn, judgement and true-form reveals ────────────────────────────── */
.public-cinema{position:fixed;z-index:15;left:0;right:min(244px,29vw);top:52px;bottom:0;display:grid;place-items:center;pointer-events:none}
.cinema-deaths{position:absolute;inset:0;display:grid;place-items:center}
.cinema-death{position:absolute;display:grid;grid-template-rows:1fr auto;justify-items:center;width:min(48vw,390px);height:min(76svh,520px);opacity:0;animation:cinema-window 4.4s ease calc(var(--beat)*4.4s) both}
@keyframes cinema-window{0%,100%{opacity:0;transform:scale(.94)}5%,86%{opacity:1;transform:scale(1)}92%{opacity:0;transform:translateY(-8px) scale(1.02)}}
.cinema-stage{position:relative;width:min(44svh,330px);aspect-ratio:1;align-self:end}
.cinema-body{position:absolute;inset:0;display:grid;place-items:center}
.cinema-body .ss{--base:min(44svh,330px);--s:1;width:100%;height:100%;filter:drop-shadow(0 18px 25px rgba(0,0,0,.92))}
.cinema-body.disguise{animation:disguise-fall 4.4s ease calc(var(--beat)*4.4s) both}
.cinema-body.truth{opacity:0;animation:truth-rise 4.4s ease calc(var(--beat)*4.4s) both}
.cinema-body.disguise .ss.oneshot{animation-delay:calc(.35s + var(--beat)*4.4s)}
.cinema-body.truth .ss.oneshot{animation-delay:calc(1.65s + var(--beat)*4.4s)}
@keyframes disguise-fall{0%,6%{opacity:0;transform:translateY(-8px)}14%,35%{opacity:1;transform:none}48%,100%{opacity:0;filter:blur(5px)}}
@keyframes truth-rise{0%,38%{opacity:0;transform:scale(.72);filter:brightness(4) blur(7px)}52%,88%{opacity:1;transform:scale(1);filter:none}100%{opacity:0}}
.cinema-ring{position:absolute;left:50%;bottom:8%;width:74%;height:15%;transform:translateX(-50%);border:2px solid rgba(255,226,148,.7);border-radius:50%;box-shadow:0 0 30px rgba(255,209,94,.45),inset 0 0 20px rgba(255,209,94,.28);animation:cinema-ring 4.4s ease calc(var(--beat)*4.4s) both}
@keyframes cinema-ring{0%,34%,100%{opacity:0;transform:translateX(-50%) scale(.4)}52%,85%{opacity:1;transform:translateX(-50%) scale(1)}}
.cinema-reveal{min-width:230px;padding:8px 18px 10px;text-align:center;border:1px solid rgba(255,225,145,.48);border-radius:16px;background:rgba(7,5,10,.9);box-shadow:0 16px 40px #000;animation:cinema-label 4.4s ease calc(var(--beat)*4.4s) both}
.cinema-reveal span,.cinema-reveal small{display:block;font-size:10px;color:var(--muted)}
.cinema-reveal strong{display:block;font-family:Georgia,serif;font-size:27px;color:var(--gold-2);margin:1px 0}
@keyframes cinema-label{0%,45%,100%{opacity:0;transform:translateY(14px)}56%,88%{opacity:1;transform:none}}
.cinema-claws,.cinema-poison,.cinema-heart,.cinema-bolt,.cinema-votes,.cinema-fate{position:absolute;inset:0;z-index:3;pointer-events:none;animation:cause-show 4.4s ease calc(var(--beat)*4.4s) both}
@keyframes cause-show{0%,16%,100%{opacity:0}24%,48%{opacity:1}62%{opacity:0}}
.cinema-claws{display:flex;gap:18px;justify-content:center;align-items:center;transform:rotate(-17deg)}
.cinema-claws i{width:9px;height:72%;border-radius:100%;background:linear-gradient(transparent,#ff625d 18%,#70131c 72%,transparent);box-shadow:0 0 12px #9b1721}
.cinema-poison{background:radial-gradient(circle at 50% 64%,rgba(103,255,131,.4),rgba(131,24,163,.27) 30%,transparent 58%);filter:blur(3px)}

.witch-magic{position:fixed;z-index:10;left:12%;bottom:8%;width:34vw;height:32vh;pointer-events:none;opacity:.45}.witch-magic i{position:absolute;bottom:0;width:12px;height:12px;border-radius:50%;background:#6aff9c;box-shadow:0 0 20px #47ff84;animation:witch-wisp 2.5s ease-in infinite}.witch-magic i:nth-child(2){left:31%;animation-delay:-.6s;background:#c95cff;box-shadow:0 0 20px #b73cff}.witch-magic i:nth-child(3){left:62%;animation-delay:-1.2s}.witch-magic i:nth-child(4){left:88%;animation-delay:-1.8s;background:#c95cff;box-shadow:0 0 20px #b73cff}.is-casting .witch-magic{opacity:1;filter:brightness(1.5)}@keyframes witch-wisp{to{transform:translate(30px,-34vh) scale(.15);opacity:0}}

/* ── Long-hunt scoring and the final podium ───────────────────────────── */
.round-results{display:grid;gap:14px}.scoreboard{border:1px solid rgba(223,183,85,.38);border-radius:20px;background:rgba(8,7,12,.88);box-shadow:0 18px 55px rgba(0,0,0,.58);overflow:hidden;backdrop-filter:blur(10px)}.score-head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(223,183,85,.18);color:var(--gold-2);font-family:Georgia,serif}.score-head b{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.score-rows{display:grid}.score-row{display:grid;grid-template-columns:30px minmax(0,1fr) 44px 42px;align-items:center;gap:7px;padding:8px 11px;border-bottom:1px solid rgba(255,255,255,.06)}.score-row:last-child{border-bottom:0}.score-rank{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:rgba(223,183,85,.12);color:var(--gold-2);font-size:10px}.score-name strong,.score-name small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score-name strong{font-size:12px}.score-name small{font-size:8px;color:var(--muted);margin-top:2px}.score-delta{text-align:right;font-weight:900;font-size:11px}.score-delta.up{color:#82e8ad}.score-delta.down{color:#ef8791}.score-total{text-align:right;font-family:Georgia,serif;font-size:21px;color:var(--gold-2)}.session-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.session-actions.solo{grid-template-columns:1fr}.session-actions .btn{padding-left:8px;padding-right:8px;font-size:10px}.podium{display:flex;align-items:end;justify-content:center;gap:10px;margin:0 auto}.podium-place{width:min(27vw,170px);display:grid;justify-items:center;align-content:start;gap:4px;padding:10px 7px;border:1px solid rgba(223,183,85,.35);border-radius:16px 16px 4px 4px;background:linear-gradient(180deg,rgba(89,60,110,.82),rgba(15,11,20,.92));box-shadow:0 16px 35px #000}.podium-place.place-1{height:min(22svh,130px);order:2;border-color:rgba(255,225,135,.75)}.podium-place.place-2{height:min(17svh,102px);order:1}.podium-place.place-3{height:min(14svh,82px);order:3}.podium-place span{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:var(--gold);color:#211509;font-weight:900}.podium-place strong{font-family:Georgia,serif;text-align:center}.podium-place b{color:var(--gold-2);font-size:22px}

/* ── Landscape geometry for the remaining classic screens ─────────────── */
@media(orientation:landscape){
  /* The crowd keeps clear of the side controls: the right rail band is
     reserved on every stage screen, and the lobby also reserves the
     invite panel's band on the left. */
  body:not([data-phase="home"]) #village{left:calc(env(safe-area-inset-left,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + min(246px,30vw))}
  body[data-phase="lobby"] #village{left:calc(env(safe-area-inset-left,0px) + min(238px,27vw))}
  .screen{width:min(100%,960px);padding-left:calc(16px + env(safe-area-inset-left,0px));padding-right:calc(16px + env(safe-area-inset-right,0px))}
  .screen.stage-screen,.screen.night-sleep{width:100%;padding:0}
  .home.home-clean{display:grid;grid-template-columns:.92fr 1.08fr;gap:18px;align-items:center;width:min(100%,880px);padding-top:var(--safe-top)}
  .home-clean .brand-lockup img{width:min(100%,380px)}
  .death-reveal{display:flex;flex-direction:row;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;margin:8vh 0 10px}
  .death-hero{width:calc(min(56svh,330px)*2/3)}
  .no-deaths{padding:16vh 16px 0}
  .modal{max-height:92svh}
  .flip-layout{display:block}
  /* Card-flip flow screens were laid out for portrait; sideways they must
     fit a short viewport or the card (and its tap target) runs off-screen. */
  .awake-lovers .flip-wrap,.awake-screen .role-peek .flip-wrap{width:calc(min(52svh,320px)*2/3);margin:8px auto 12px}
  .mini-cards{grid-template-columns:repeat(2,minmax(0,calc(min(46svh,300px)*2/3)));justify-content:center}
  .phase-ribbon h1{font-size:clamp(24px,7svh,36px)}
}

@media(prefers-reduced-motion:reduce){
  .cinema-deaths{position:relative;inset:auto;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .cinema-death{position:relative;opacity:1;width:min(28vw,230px);height:auto;animation:none}
  .cinema-body.disguise,.cinema-claws,.cinema-poison,.cinema-heart,.cinema-bolt,.cinema-votes,.cinema-fate{display:none}
  .cinema-body.truth,.cinema-reveal,.cinema-ring{opacity:1;animation:none;transform:none;filter:none}
}

/* ── The finale: verdict, village and scores on one fixed stage ──────────
   Game-over and session-over fill exactly one viewport: the verdict and
   controls (and the podium) on the left, the revealed village and the
   scoreboard on the right. Everything is sized in viewport units so nothing
   is ever cut off and no screen needs scrolling; only villages far larger
   than the space can ever pan their card grid or score list internally. */
.finale-screen{width:100%;max-width:none;height:100svh;height:100dvh;min-height:0;overflow:hidden;display:grid;
  grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);gap:16px;align-items:center;
  padding:calc(var(--safe-top) + 6px) calc(16px + env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) calc(16px + env(safe-area-inset-left,0px))}
.finale-side{display:grid;gap:min(2.2svh,13px);justify-items:center;min-width:0}
.finale-main{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;align-content:center;height:100%;min-height:0;min-width:0}
.session-over-screen .finale-main{grid-template-rows:minmax(0,1fr)}
.finale-screen .game-over-hero{padding:0;text-align:center}
.finale-screen .game-over-hero .victory-moon{font-size:min(9svh,52px);margin:0}
.finale-screen .game-over-hero h1{font-size:clamp(20px,8.4svh,42px);line-height:.95;margin:min(1.4svh,8px) 0}
.finale-screen .game-over-hero p{font-size:clamp(10px,3svh,14px);line-height:1.45;margin:0}
.finale-screen .session-actions{width:100%}
.finale-screen .session-actions .btn{min-height:44px}
.finale-screen .final-grid{grid-template-columns:repeat(auto-fill,minmax(min(11svh,66px),1fr));gap:6px;max-height:36svh;overflow-y:auto;padding:2px;scrollbar-width:none}
.finale-screen .final-grid::-webkit-scrollbar,.finale-screen .scoreboard::-webkit-scrollbar{display:none}
.finale-screen .scoreboard{min-height:0;max-height:100%;overflow-y:auto;scrollbar-width:none}
.finale-screen .score-row{padding:5px 10px}
.finale-screen .score-total{font-size:17px}
.finale-screen .podium{width:100%;align-items:end}
/* Podium steps come from bottom padding, never fixed heights, so the rank,
   name and score are always fully visible. */
.finale-screen .podium-place{width:min(30%,150px);height:auto;min-height:0;padding:9px 6px 8px}
.finale-screen .podium-place.place-1{padding-bottom:min(6svh,34px)}
.finale-screen .podium-place.place-2{padding-bottom:min(3svh,18px)}
.finale-screen .podium-place b{font-size:19px}
/* Keep the scoreboard's header clear of the floating connection pill. */
.session-over-screen.finale-screen{padding-top:calc(var(--safe-top) + 52px)}
</style>
